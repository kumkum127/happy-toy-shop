<!DOCTYPE html>
<html>

<head>
    <title>Products - Happy Toy Shop</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🧸 Happy Toy Shop</h1>
    <p>Our Toy Collection</p>
</header>

<nav>
    <a href="index.jsp">Home</a>
    <a href="index.html">Products</a>
    <a href="cart.html">Cart</a>
    <a href="contact.html">Contact</a>
</nav>

<main>

    <h2>Our Products</h2>

    <div class="products">

        <div class="product">

            <img src="images/doll.jpeg"
                 alt="Beautiful Doll"
                 width="200"
                 height="200">

            <h3>Beautiful Doll</h3>

            <p>Price: ₹499</p>

            <button onclick="addToCart('Beautiful Doll', 499)">
                Add to Cart
            </button>

        </div>


        <div class="product">

            <img src="images/bike.jpeg"
                 alt="Toy Bike"
                 width="200"
                 height="200">

            <h3>Toy Bike</h3>

            <p>Price: ₹699</p>

            <button onclick="addToCart('Toy Bike', 699)">
                Add to Cart
            </button>

        </div>


        <div class="product">

            <img src="images/teddy.jpeg"
                 alt="Teddy Bear"
                 width="200"
                 height="200">

            <h3>Teddy Bear</h3>

            <p>Price: ₹599</p>

            <button onclick="addToCart('Teddy Bear', 599)">
                Add to Cart
            </button>

        </div>

    </div>

</main>

<footer>
    <p>© 2026 Happy Toy Shop</p>
</footer>

<script src="script.js"></script>

</body>
</html>
